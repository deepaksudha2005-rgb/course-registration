apiVersion: apps/v1
kind: Deployment
metadata:
  name: course-registration
spec:
  replicas: 1
  selector:
    matchLabels:
      app: course-registration
  template:
    metadata:
      labels:
        app: course-registration
    spec:
      containers:
      - name: course-registration
        image: deepak340/course-registration
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: course-registration-service
spec:
  type: NodePort
  selector:
    app: course-registration
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30001
